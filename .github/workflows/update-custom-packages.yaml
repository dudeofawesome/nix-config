name: Update custom packages

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-custom-packages.yaml

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-custom-packages
  cancel-in-progress: false

jobs:
  discover:
    name: Discover package updaters
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main

      - name: Find packages with update scripts
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          packages="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                packages = flake.packages.${builtins.currentSystem};
              in
              builtins.filter (
                name: packages.${name} ? updateScript
              ) (builtins.attrNames packages)
            '
          )"

          echo "packages=$(jq --compact-output . <<< "$packages")" \
            >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.package }}
    needs: discover
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Update package
        id: update
        continue-on-error: true
        shell: bash
        run: >-
          nix run nixpkgs#nix-update --
          --flake
          --use-update-script
          "${{ matrix.package }}"

      - name: Report failed update
        if: steps.update.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Package update failed::${{ matrix.package }} failed"

      - name: Format changed Nix files
        if: steps.update.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          nix_files=()
          while IFS= read -r nix_file; do
            nix_files+=("$nix_file")
          done < <(
            git ls-files --modified --others --exclude-standard -- '*.nix'
          )

          if ((${#nix_files[@]})); then
            nix fmt "${nix_files[@]}"
          fi

      - name: Create pull request
        if: steps.update.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/update-${{ matrix.package }}
          delete-branch: true
          sign-commits: true
          commit-message: 'chore(${{ matrix.package }}): update package'
          title: 'chore(${{ matrix.package }}): update package'
          body: |
            Automated update for `${{ matrix.package }}`.
          labels: dependencies
