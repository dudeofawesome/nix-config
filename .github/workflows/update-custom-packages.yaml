name: Update custom packages

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-custom-packages.yaml

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-custom-packages
  cancel-in-progress: false

jobs:
  discover:
    name: Discover package updaters
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c251f11beeb14adb5490acc1b192175d8ae0e95e # main

      - name: Find packages with update scripts
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          packages="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                packages = flake.packages.${builtins.currentSystem};
              in
              builtins.filter (
                name: packages.${name} ? updateScript
              ) (builtins.attrNames packages)
            '
          )"

          echo "packages=$(jq --compact-output . <<< "$packages")" \
            >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.package }}
    needs: discover
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c251f11beeb14adb5490acc1b192175d8ae0e95e # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@fa09681925d1168f06a354b19c9b26a3fd560db7 # main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Update package
        id: update
        continue-on-error: true
        shell: bash
        run: >-
          nix run nixpkgs#nix-update --
          --flake
          --use-update-script
          "${{ matrix.package }}"

      - name: Verify package update script
        id: verify
        if: steps.update.outcome == 'success'
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: >-
          nix run nixpkgs#nix-update --
          --flake
          --use-update-script
          "$PACKAGE"

      - name: Report failed update
        if: >-
          !cancelled() &&
          (steps.update.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
          PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.repository.default_branch }}/packages/${{ matrix.package }}/package.nix
        shell: bash
        run: |
          set -euo pipefail

          echo "::warning title=Package update failed::$PACKAGE failed"
          marker="<!-- update-custom-packages: $PACKAGE -->"

          jobs_endpoint="repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          jobs_endpoint+="/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          job_url="$(
            gh api --paginate "$jobs_endpoint" |
              jq --slurp --exit-status --raw-output \
                --arg name "Update $PACKAGE" '
                  [.[] | .jobs[] | select(.name == $name) | .html_url]
                  | if length == 1 and .[0] != null then .[0]
                    else error("Expected exactly one matching update job")
                    end
                '
          )"

          # Read every page directly to avoid search indexing delays and limits.
          issues="$(
            gh api --paginate \
              "repos/$GH_REPO/issues?state=open&per_page=100"
          )"
          existing_issue="$(
            jq --slurp --raw-output --arg marker "$marker" '
              [
                .[][]
                | select(.pull_request == null)
                | select((.body // "") | contains($marker))
                | .html_url
              ][0] // empty
            ' <<< "$issues"
          )"

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<EOF
          $marker
          The update script for [\`$PACKAGE\`]($PACKAGE_URL) failed during the automated update or verification run.

          [View the latest failed job]($job_url).

          <sub>This text will be replaced on next workflow run.</sub>
          EOF

          if [[ -n "$existing_issue" ]]; then
            gh issue edit "$existing_issue" --body-file "$body_file"
          else
            gh issue create \
              --title "Update script failed: $PACKAGE" \
              --body-file "$body_file"
          fi

      - name: Format changed Nix files
        if: steps.update.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          nix_files=()
          while IFS= read -r nix_file; do
            nix_files+=("$nix_file")
          done < <(
            git ls-files --modified --others --exclude-standard -- '*.nix'
          )

          if ((${#nix_files[@]})); then
            nix fmt "${nix_files[@]}"
          fi

      - name: Create pull request
        if: steps.update.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.UPDATE_PACKAGES_TOKEN }}
          branch-token: ${{ github.token }}
          branch: chore/update-${{ matrix.package }}
          delete-branch: true
          sign-commits: true
          commit-message: 'chore(${{ matrix.package }}): update package'
          title: 'chore(${{ matrix.package }}): update package'
          body: |
            Automated update for `${{ matrix.package }}`.
          labels: dependencies
