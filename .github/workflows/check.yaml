name: Check

on:
  push:
    branches: ['*']
    tags-ignore: ['*']
  pull_request:

permissions:
  id-token: write
  contents: read

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  lint-flake:
    name: Lint Flake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Lint Flake
        shell: bash
        run: |
          nix flake check \
            --all-systems \
            --keep-going \
            ;
