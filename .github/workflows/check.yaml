name: Check

on:
  push:
    branches: [main]
    tags-ignore: ['*']
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  lint-flake:
    name: Lint Flake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Lint Flake
        shell: bash
        run: |
          nix flake check \
            --all-systems \
            --keep-going \
            ;

  test-renovate-nix-updater:
    name: Test custom package updater
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test custom package updater
        run: |
          node --test \
            scripts/renovate-nix-packages-update.test.mjs \
            scripts/check-package-updates.test.mjs
