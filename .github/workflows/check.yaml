name: Check

on:
  push:
    branches: [main]
    tags-ignore: ['*']
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  lint-flake:
    name: Lint Flake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Lint Flake
        shell: bash
        run: |
          nix flake check \
            --all-systems \
            --keep-going \
            ;
