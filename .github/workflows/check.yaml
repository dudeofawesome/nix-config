name: Check

on:
  push:
    branches: [main]
    tags-ignore: ['*']
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  lint-flake:
    name: Lint Flake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@b074b4ad5f255f9c8a6a2414a2f07e7f4f2925a3 # main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@fa09681925d1168f06a354b19c9b26a3fd560db7 # main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      - name: Lint Flake
        shell: bash
        run: |
          nix flake check \
            --all-systems \
            --keep-going \
            ;
